name: build-thriftc-maven-plugin

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: set up mise
        uses: jdx/mise-action@v4

      - name: build and verify
        run: mise run verify
